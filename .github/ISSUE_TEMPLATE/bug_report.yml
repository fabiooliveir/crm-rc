name: "🐛 Relato de Bug"
description: "Reportar uma falha, inconsistência ou erro no CRM-RC"
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Descrição do Problema
      description: O que aconteceu de inesperado?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Passos para Reproduzir
      placeholder: |
        1. Acessar a tela X
        2. Clicar em Y
        3. Observar o erro Z
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamento Esperado
    validations:
      required: true
